services:
  auth:
    build: .
    environment:
      REDIS_HOST: redis
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
